# Run the test suite on every push and PR. Render auto-deploys master on
# push, so this is the only automated gate between a red suite and a live
# classroom — check the badge/Actions tab before relying on a fresh deploy.
name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
