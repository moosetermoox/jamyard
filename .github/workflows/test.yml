# Test on every push/PR; deploy to Render ONLY when the suite is green.
#
# Deploy-on-green setup (one-time, manual):
#   1. Render dashboard → your service → Settings → Auto-Deploy: OFF
#   2. Same page → copy the "Deploy Hook" URL
#   3. GitHub repo → Settings → Secrets and variables → Actions →
#      new secret RENDER_DEPLOY_HOOK = that URL
# Until the secret exists, the deploy step skips harmlessly (and Render's
# auto-deploy keeps working if you leave it on).
name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (skips unless RENDER_DEPLOY_HOOK secret is set)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not configured — skipping (Render auto-deploy handles it)"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy triggered after green tests ✓"
