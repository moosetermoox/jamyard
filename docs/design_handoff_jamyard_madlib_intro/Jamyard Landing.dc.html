<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#F2EEE5;font-family:'DM Sans',sans-serif}a{color:#2A2620}a:hover{color:#E5482B}</style>
<script>window.OM_SCENES = '[{"name":"Wordmark","dur":1.0},{"name":"Sentence","dur":0.9},{"name":"Spin","dur":3.2},{"name":"Hold","dur":2.4}]';</script>
</helmet>
<div style="position:relative;background:#F2EEE5;">
  <h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;">JAMYARD is a yard of whole-class activities for connecting, thinking, reviewing and having fun. Use them, remix them, or create your own.</h1>
  <div style="position:fixed;inset:0;z-index:2;background:#F2EEE5;display:flex;align-items:center;justify-content:center;opacity:{{ introOpacity }};transform:{{ introTransform }};visibility:{{ introVisibility }};pointer-events:{{ introPointer }};">
    <div style="position:absolute;left:0;right:0;top:0;display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:22px 4vw;box-sizing:border-box;">
      <a href="#" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:14px;letter-spacing:0.06em;color:#2A2620;background:#FFC800;padding:11px 18px 12px;display:block;white-space:nowrap;box-shadow:0 3px 5px rgba(50,35,15,0.26);text-decoration:none;" style-hover="background:#FFD63A;">STUDENT? JOIN A ROOM</a>
    </div>
    <div aria-hidden="true" style="width:100%;max-width:1400px;padding:0 4vw;box-sizing:border-box;">
      <x-import component-from-global-scope="LiveMadlib" from="./madlib-shim.js ./madlib-banner.jsx" max-scale="{{ maxScale }}" hide-mark="{{ hideMark }}" hint-size="100%,440px"></x-import>
    </div>
    <sc-if value="{{ showCue }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ skip }}" aria-label="Scroll to the home page" style="position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;letter-spacing:0.08em;color:#2A2620;padding:8px 16px;" style-hover="color:#E5482B;">
        <span>scroll</span>
        <span style="display:block;width:2px;height:28px;background:currentColor;transition:transform 600ms cubic-bezier(0.4,0,0.2,1);transform:{{ cueTransform }};"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ flyOn }}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position:fixed;left:0;top:0;z-index:3;display:flex;gap:6px;align-items:flex-end;transform-origin:0 0;pointer-events:none;transform:{{ flyTransform }};">
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;color:#2A2620;background:#E3C8A0;background-image:repeating-linear-gradient(92deg,rgba(110,75,40,0.10) 0 1px,transparent 1px 6px),repeating-linear-gradient(88deg,rgba(70,45,20,0.06) 0 2px,transparent 2px 14px);padding:6px 14px 8px;transform:rotate(-2deg);display:inline-block;box-shadow:0 3px 5px rgba(50,35,15,0.30);">JAM</span>
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;color:#FDF9F0;background:#E5482B;padding:6px 14px 8px;transform:rotate(1.5deg);display:inline-block;box-shadow:0 3px 5px rgba(50,35,15,0.30);">YARD</span>
    </div>
  </sc-if>
  <div style="height:{{ spacerHeight }};"></div>
  <iframe ref="{{ frameRef }}" src="screens/home-fold.html" title="Jamyard home page" onLoad="{{ fitFrame }}" style="display:block;width:100%;height:{{ frameHeight }};border:0;position:relative;z-index:1;background:#F2EEE5;"></iframe>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;foldHeadline&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hide&quot;,&quot;keep&quot;],&quot;default&quot;:&quot;hide&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;exit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;fade&quot;,&quot;fade + lift&quot;],&quot;default&quot;:&quot;fade + lift&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fadeDistance&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.3,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;default&quot;:0.6,&quot;unit&quot;:&quot;screens&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;scrollCue&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { p: 0, frameH: 0, wide: true, nudge: false };
  frameRef = React.createRef();
  dist() { return window.innerHeight * (this.props.fadeDistance ?? 0.6); }
  componentDidMount() {
    this.onScroll = () => {
      const p = Math.max(0, Math.min(1, window.scrollY / this.dist()));
      const wide = window.innerWidth >= 560;
      if (p > 0) this.scrolled = true;
      if (this.state.p === 0 && p > 0) this.measureSrc();
      if (p !== this.state.p || wide !== this.state.wide) this.setState({ p, wide });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onScroll);
    this.onResize = () => { if (this.state.p === 0) this.measureSrc(); this.measureTgt(); };
    window.addEventListener('resize', this.onResize);
    this.onScroll();
    // gentle nudge on the scroll line if nobody has scrolled after 4s
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.nudgeStart = setTimeout(() => {
      if (reduced) return;
      this.nudgeTimer = setInterval(() => {
        if (this.scrolled) { clearInterval(this.nudgeTimer); if (this.state.nudge) this.setState({ nudge: false }); return; }
        this.setState((s) => ({ nudge: !s.nudge }));
      }, 700);
    }, 4000);
  }
  componentDidUpdate(prev) {
    if (prev.foldHeadline !== this.props.foldHeadline) this.applyFold();
    if (prev.fadeDistance !== this.props.fadeDistance) this.onScroll();
    this.syncTgt();
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onScroll);
    window.removeEventListener('resize', this.onResize);
    clearTimeout(this.nudgeStart); clearInterval(this.nudgeTimer);
  }
  measureSrc() {
    const el = document.querySelector('[data-mark]');
    if (el) { const r = el.getBoundingClientRect(); this.src = { x: r.left, y: r.top, w: r.width }; }
  }
  measureTgt() {
    try {
      const f = this.frameRef.current, d = f.contentDocument;
      const jam = Array.from(d.querySelectorAll('span')).find((e) => e.textContent.trim() === 'JAM');
      if (!jam) return;
      this.tgtEl = jam.parentElement;
      const r = this.tgtEl.getBoundingClientRect(), fr = f.getBoundingClientRect();
      // where it will sit once the page is scrolled by the fade distance (frame top = 0 then)
      this.tgt = { x: fr.left + r.left, y: r.top, w: r.width };
      this.syncTgt();
    } catch (e) {}
  }
  syncTgt() { if (this.tgtEl) this.tgtEl.style.opacity = this.state.p >= 1 || !this.src ? '1' : '0'; }
  applyFold() {
    try {
      const d = this.frameRef.current.contentDocument;
      const h = d.getElementById('fold-headline');
      if (h) {
        const hide = (this.props.foldHeadline ?? 'hide') === 'hide';
        h.style.display = hide ? 'none' : '';
        h.parentElement.style.justifyContent = hide ? 'center' : 'space-between';
      }
      this.setState({ frameH: Math.max(d.documentElement.scrollHeight, d.body.scrollHeight) }, () => this.measureTgt());
    } catch (e) {}
  }
  renderVals() {
    const { p, frameH, nudge } = this.state;
    const lift = (this.props.exit ?? 'fade + lift') === 'fade + lift';
    const fd = this.props.fadeDistance ?? 0.6;
    const fly = this.src && this.tgt && p > 0 && p < 1;
    let flyTransform = 'none';
    if (fly) {
      const e = p * p * (3 - 2 * p);
      const x = this.src.x + (this.tgt.x - this.src.x) * e;
      const y = this.src.y + (this.tgt.y - this.src.y) * e;
      const s0 = this.src.w / this.tgt.w;
      flyTransform = `translate(${x}px, ${y}px) scale(${s0 + (1 - s0) * e})`;
    }
    return {
      introOpacity: 1 - p,
      introTransform: lift ? `translateY(${-p * 48}px) scale(${1 - p * 0.03})` : 'none',
      introVisibility: p >= 1 ? 'hidden' : 'visible',
      introPointer: p > 0.5 ? 'none' : 'auto',
      showCue: (this.props.scrollCue ?? true) && p < 0.2,
      cueTransform: nudge ? 'translateY(8px)' : 'translateY(0)',
      maxScale: 1.15,
      hideMark: p > 0 && !!this.src && !!this.tgt,
      flyOn: fly,
      flyTransform,
      wideBar: this.state.wide,
      spacerHeight: `${fd * 100}vh`,
      frameRef: this.frameRef,
      frameHeight: frameH ? frameH + 'px' : '100vh',
      fitFrame: () => this.applyFold(),
      skip: (e) => { if (e && e.preventDefault) e.preventDefault(); window.scrollTo({ top: this.dist(), behavior: 'smooth' }); },
    };
  }
}
</script>
</body>
</html>
