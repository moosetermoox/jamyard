<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make it yours - Jamyard</title>
  <link rel="stylesheet" href="/shared/design.css">
  <link rel="stylesheet" href="/shared/totem.css">
  <link rel="stylesheet" href="/shared/make-it-yours.css">
  <link rel="stylesheet" href="/shared/activity-map.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Make it yours as a page (2026-09-09): what your class will see, the
       question editable in place, one red TRY IT. Untouched = the original
       runs and no copy is saved, same as the dialog before it. -->
  <header class="make-header">
    <a href="/" class="wordmark" aria-label="Jamyard home">
      <span class="wordmark-jam">JAM</span><span class="wordmark-yard">YARD</span>
    </a>
    <a id="back-link" href="/library" class="back-link">Back to the yard</a>
  </header>

  <main class="make-page" id="make-page">
    <div class="make-top">
      <h1 class="name-chip" id="name-chip">Your activity</h1>
    </div>

    <!-- The print: the first step students answer, drawn from the same
         words the host will show. The question plank (and any field
         planks) are the things to touch; the rest is the template's. -->
    <div class="print-wrap">
      <span class="print-label" id="print-label">What your class will see</span>
      <div class="print-paper">
        <div class="print-screen" id="print-screen">
          <span class="print-mark" aria-hidden="true">Jam yard</span>
          <span class="print-name" id="print-name"></span>
          <div class="print-prompt-holder" id="print-prompt"></div>
          <div class="print-fields" id="print-fields"></div>
          <p class="print-instruction" id="print-instruction" hidden></p>
          <div class="print-choices" id="print-choices" hidden></div>
          <p class="print-audience" id="print-audience" hidden></p>
          <div class="print-timer" id="print-timer" hidden>
            <button type="button" class="timer-chip" id="timer-chip" title="Tap to change the timer"></button>
            <span class="timer-note" id="timer-note">Timer · tap to change</span>
          </div>
        </div>
        <!-- The seconds after a door: the print dims and this says what is happening -->
        <div class="opening" id="opening" hidden>
          <div class="opening-pile" aria-hidden="true">
            <span class="opening-block b1"></span><span class="opening-block b2"></span><span class="opening-block b3"></span><span class="opening-block b4"></span>
          </div>
          <div class="opening-card">
            <span class="opening-title" id="opening-title">Opening with pretend students…</span>
            <span class="opening-text" id="opening-text"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- The one red, and the two quieter ways out -->
    <div class="doors" id="doors">
      <div class="try-col">
        <div class="try-stack">
          <button type="button" class="try-btn" id="try-btn" aria-describedby="try-sub">
            <span class="try-word">Try it</span>
          </button>
          <span class="try-plinth" aria-hidden="true"></span>
          <span class="try-base" aria-hidden="true"></span>
        </div>
        <span class="try-sub" id="try-sub">With pretend students</span>
      </div>
      <button type="button" class="host-btn" id="host-btn">Host it now</button>
      <a href="#" class="designer-link" id="designer-link">Make it even more yours in the designer</a>
      <span class="doors-note" id="doors-note" hidden></span>
      <a href="#" class="cancel-link" id="cancel-link" hidden>Cancel</a>
    </div>

    <p class="make-error" id="make-error" hidden></p>

    <!-- A recipe's own setup panel (the quiz's questions, the bluff's facts):
         the same editor the dialog had, mounted right under the doors: on a
         quiz the questions are the thing to change (owner 2026-09-13) -->
    <section class="panel-section" id="panel-section" hidden>
      <h2 class="panel-heading" id="panel-heading">The questions</h2>
      <div id="panel-holder"></div>
    </section>

    <!-- The pairs of a matching activity (Vocab Match's rounds), shown and
         edited here the way the quiz shows its questions (owner 2026-09-13).
         Hidden unless the activity has match steps with plain-text pairs. -->
    <section class="pairs-section" id="pairs-section" hidden>
      <h2 class="panel-heading">The pairs</h2>
      <div class="pairs-card" id="pairs-holder"></div>
    </section>

    <!-- Make it fit your class (2026-09-13): rows of chips, nothing folded.
         Every setting is ONE row, the question on the left and the answer
         as chips on the right, tapped in place; a typed answer is a plank
         in its row. The AI's one or two questions come first, then Your
         class (a chip and a "change" link that shows the picker), Student
         names, Early-bird joke. The question is the only text on a row. -->
    <section class="fit-section" id="fit-section">
      <h2 class="panel-heading">Make it fit your class</h2>
      <div class="fit-card">
        <div class="fit-rows" id="fit-rows"></div>
        <!-- With an answer in: one button runs the AI fit once and redraws
             What happens from the result; the doors reuse that copy -->
        <div class="fit-foot" id="fit-foot" hidden>
          <button type="button" class="fit-chip fit-see" id="fit-see">See how it reads</button>
          <span class="fit-note" id="fit-note"></span>
        </div>
        <div class="class-holder" id="class-holder" hidden></div>
      </div>
    </section>

    <!-- What happens, stop by stop: the treasure map the popups carried
         (the home's doors land here now, 2026-09-10) -->
    <section class="map-section" id="map-section">
      <h2 class="panel-heading">What happens</h2>
      <div id="map-holder"></div>
    </section>

  </main>

  <script src="/shared/phase-names.js"></script>
  <script src="/shared/activity-map.js"></script>
  <script src="/shared/my-games.js"></script>
  <script src="/shared/owner-mode.js"></script>
  <script src="/shared/game-visibility.js"></script>
  <script src="/shared/dialog.js"></script>
  <script src="/shared/activity-prefs.js"></script>
  <script src="/shared/teacher-profile.js"></script>
  <script src="/shared/setup-knobs.js"></script>
  <script src="/shared/growing-text.js"></script>
  <script src="/shared/speech-input.js"></script>
  <script src="/shared/rich-text.js"></script>
  <script src="/shared/bold-box.js"></script>
  <script src="/shared/make-it-yours-doors.js"></script>
  <script src="/shared/make-it-yours.js"></script>
  <script src="/shared/feedback-widget.js"></script>
  <script src="/shared/host-launch.js"></script>
  <script src="make.js"></script>
</body>
</html>
