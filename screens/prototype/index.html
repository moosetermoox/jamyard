<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview - Jamyard</title>
  <link rel="stylesheet" href="/shared/design.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="control-bar">
    <a href="/library" id="back-link">&larr; Library</a>
    <h1>Preview</h1>
    <div class="controls">
      <label for="game-select">Activity:</label>
      <select id="game-select">
        <option value="">Loading...</option>
      </select>

      <label for="player-count">Players:</label>
      <input type="range" id="player-count" min="1" max="8" value="2">
      <span id="player-count-display">2</span>

      <button id="launch-btn" disabled title="Open a practice room right here, the projected teacher screen next to pretend student screens">Launch</button>
      <button id="bot-fill-btn" hidden title="Auto-fill an answer for every practice player so you can move through the steps quickly">Bot Fill</button>
      <button id="skip-btn" hidden title="Skip the current step's timer / close submissions / continue">Skip timer</button>
      <button id="reset-btn" hidden title="Close this practice room and start fresh">Reset</button>

      <div id="view-toggle" hidden>
        <button id="view-grid-btn" class="view-btn active" title="Show all players at once">Grid</button>
        <button id="view-carousel-btn" class="view-btn" title="Step through one player at a time">One at a time</button>
      </div>

    </div>

    <button id="host-btn" disabled title="Done previewing? Start a live room your class can join right now">▶ Host this</button>
  </div>

  <div id="iframe-container"><p id="prelaunch-hint">Pick an activity and press Launch, you get the teacher screen and pretend students, side by side.</p></div>

  <!-- Carousel overlays, fixed position so they sit above iframes -->
  <button id="carousel-prev" class="carousel-arrow carousel-arrow-left" hidden title="Previous player screen">&larr;</button>
  <button id="carousel-next" class="carousel-arrow carousel-arrow-right" hidden title="Next player screen">&rarr;</button>
  <div id="carousel-dots" hidden></div>

  <script src="/shared/game-visibility.js"></script>
  <script src="/shared/my-games.js"></script>
  <script src="/shared/owner-mode.js"></script>
  <script src="/shared/feedback-widget.js"></script>
  <script src="prototype.js"></script>
</body>
</html>
