<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview - Jamyard</title>
  <link rel="stylesheet" href="/shared/design.css">
  <link rel="stylesheet" href="/shared/totem.css">
  <link rel="stylesheet" href="/shared/activity-map.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="control-bar">
    <a href="/library" id="back-link">&larr; The yard</a>
    <h1>Preview</h1>
    <div class="controls">
      <label for="game-select">Activity:</label>
      <select id="game-select">
        <option value="">Loading...</option>
      </select>

      <label for="player-count">Players:</label>
      <!-- The range input stays as the value holder (all the relaunch
           logic hangs on its change event); the seat blocks are the
           visible control: filled blocks are players, dashed are empty
           seats (Totem: preview-prototype.png). -->
      <input type="range" id="player-count" min="1" max="8" value="4">
      <div id="seat-blocks" role="group" aria-label="How many pretend students"></div>
      <span id="player-count-display">4</span>

      <button id="launch-btn" disabled title="Open a practice room right here, the projected teacher screen next to pretend student screens">Launch</button>
      <button id="reset-btn" hidden title="Close this practice room and start fresh">Reset</button>

      <div id="view-toggle" hidden>
        <button id="view-grid-btn" class="view-btn" title="Show all players at once">Grid</button>
        <button id="view-carousel-btn" class="view-btn active" title="Step through one player at a time">One at a time</button>
      </div>

    </div>

    <a id="edit-link" hidden title="Spot something to change? Open this activity in the designer">✎ Edit</a>
    <button id="host-btn" disabled title="Done previewing? Start a live room your class can join right now">▶ Host this</button>
  </div>

  <!-- The stage row: the treasure-map rail on the left (what happens,
       with a "you are here" that follows the live room), the screens
       beside it. The rail appears on Launch and hides on Reset. -->
  <div id="stage-row">
    <aside id="map-rail" hidden aria-label="The activity's plan, current step marked. Click a step to skip ahead to it.">
      <div class="map-rail-label">The plan</div>
      <p class="map-rail-hint">Click a step to skip ahead to it.</p>
      <div id="map-rail-holder"></div>
    </aside>

    <!-- The test bench, empty: a teacher board on its stand beside dashed
         pretend-student seats (Totem: preview-prototype.png 11a). Launch
         replaces all of this with the live pieces; Reset restores it. -->
    <div id="iframe-container">
      <div id="prelaunch-stage">
        <div class="stage-pieces">
          <div class="stage-board-group">
            <div class="stage-board">Teacher screen</div>
            <div class="stage-plinth"></div>
            <div class="stage-base"></div>
          </div>
          <div class="stage-slot">Pretend student</div>
          <div class="stage-slot"></div>
          <div class="stage-slot"></div>
        </div>
        <p id="prelaunch-hint">Pick an activity and press <strong class="hint-launch">Launch</strong>, you get the teacher screen and pretend students, side by side.</p>
      </div>
    </div>

    <!-- Carousel overlays: anchored to the stage row (not the viewport)
         so they sit over the PLAYER panel even with the map rail open.
         Outside #iframe-container because Launch clears its contents. -->
    <button id="carousel-prev" class="carousel-arrow carousel-arrow-left" hidden title="Previous player screen">&larr;</button>
    <button id="carousel-next" class="carousel-arrow carousel-arrow-right" hidden title="Next player screen">&rarr;</button>
    <div id="carousel-dots" hidden></div>
  </div>

  <!-- The bench bar: the two controls you actually use while testing,
       big and at the bottom where the eyes are (observation 2026-08-27:
       nobody found Bot Fill / Skip timer in the crowded top bar). -->
  <div id="bench-bar" hidden>
    <span class="bench-hint">You play all the students. Stuck or done typing?</span>
    <button id="bot-fill-btn" title="Auto-fill an answer for every practice player so you can move through the steps quickly">Bot Fill<span class="bench-sub">answers for everyone</span></button>
    <button id="skip-btn" title="Skip the current step's timer / close submissions / continue">Skip timer<span class="bench-sub">move things along</span></button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/game-visibility.js"></script>
  <script src="/shared/my-games.js"></script>
  <script src="/shared/owner-mode.js"></script>
  <script src="/shared/phase-names.js"></script>
  <script src="/shared/activity-map.js"></script>
  <script src="/shared/feedback-widget.js"></script>
  <script src="prototype.js"></script>
</body>
</html>
