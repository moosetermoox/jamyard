<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host - Classroom Games</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Classroom Games</h1>

  <!-- LOBBY SECTION -->
  <section id="lobby-section">
    <div id="game-select-section">
      <label for="game-select">Choose a game:</label>
      <select id="game-select">
        <option value="">Loading games...</option>
      </select>
      <button id="create-room-btn">Create Room</button>
    </div>

    <div id="room-code-section" hidden>
      <p id="game-name-display"></p>
      <div id="room-code">XXXX</div>
    </div>

    <div id="players-section">
      <h2>Players:</h2>
      <ul id="player-list"></ul>
    </div>

    <button id="start-game-btn" disabled>Start Game</button>
  </section>

  <!-- COLLECT SECTION -->
  <section id="collect-section" hidden>
    <h2>Players are answering...</h2>
    <p id="prompt-display" class="prompt"></p>
    <p id="submission-count" class="big-text">0 of 0 submitted</p>
    <button id="close-submissions-btn">Close Submissions</button>
  </section>

  <!-- PROCESS SECTION -->
  <section id="process-section" hidden>
    <h2>AI is creating your poem...</h2>
    <p class="big-text">Working...</p>
  </section>

  <!-- REVEAL SECTION -->
  <section id="reveal-section" hidden>
    <div id="ai-result" class="reveal-content"></div>
    <div id="reveal-responses" hidden>
      <h3>Player Responses:</h3>
      <ul id="responses-list"></ul>
    </div>
    <button id="continue-btn">Continue</button>
  </section>

  <!-- VOTE STATUS SECTION -->
  <section id="vote-section" hidden>
    <h2>Voting in progress...</h2>
    <p id="vote-mode-display"></p>
    <p id="vote-count" class="big-text">0 of 0 votes received</p>
    <button id="close-voting-btn">Close Voting</button>
  </section>

  <!-- ELIMINATION RESULTS SECTION -->
  <section id="elimination-section" hidden>
    <h2>Round Results</h2>
    <p id="eliminated-names" class="eliminated-text"></p>
    <p id="remaining-count" class="big-text"></p>
    <button id="elimination-continue-btn">Continue</button>
  </section>

  <!-- WINNER SECTION -->
  <section id="winner-section" hidden>
    <h2 id="winner-name" class="winner-text"></h2>
    <div id="standings-list" class="standings"></div>
    <button id="winner-end-btn">End Game</button>
  </section>

  <!-- END SECTION -->
  <section id="end-section" hidden>
    <h2 class="game-over">Game Over!</h2>
    <button id="play-again-btn">Play Again</button>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="host.js"></script>
</body>
</html>
