<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Game - Classroom Games</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header id="editor-header">
    <div class="header-left">
      <a href="/designer" class="back-link">&larr; Back to List</a>
      <h1 id="header-game-name">Loading...</h1>
    </div>
    <div class="header-right">
      <button id="test-game-btn" class="btn btn-secondary">Test Game</button>
      <button id="save-btn" class="btn btn-primary">Save</button>
    </div>
  </header>

  <div id="editor-body">
    <!-- Left Sidebar: Game Settings -->
    <aside id="settings-panel">
      <h2>Game Settings</h2>
      <div class="form-group">
        <label for="game-name">Name</label>
        <input type="text" id="game-name" placeholder="Game name">
      </div>
      <div class="form-group">
        <label for="game-description">Description</label>
        <textarea id="game-description" rows="3" placeholder="What's this game about?"></textarea>
      </div>
      <div class="form-group">
        <label for="game-min-players">Min Players</label>
        <input type="number" id="game-min-players" min="1" placeholder="2">
      </div>
      <div class="form-group">
        <label for="game-max-players">Max Players</label>
        <input type="number" id="game-max-players" min="1" placeholder="36">
      </div>
    </aside>

    <!-- Main Canvas: Phase Flow -->
    <main id="canvas-area">
      <div id="canvas-toolbar">
        <button id="add-phase-btn" class="btn btn-add">+ Add Phase</button>
      </div>
      <div id="phase-canvas">
        <div id="phase-list"></div>
      </div>
      <p id="canvas-loading">Loading game...</p>
      <p id="canvas-error" hidden></p>
    </main>

    <!-- Right Sidebar: Phase Config -->
    <aside id="phase-panel" class="hidden">
      <div class="panel-header">
        <h2>Phase Config</h2>
        <button id="close-phase-panel" class="btn-icon">&times;</button>
      </div>
      <div id="phase-config-form"></div>
    </aside>
  </div>

  <script src="editor.js"></script>
</body>
</html>
