<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Activity - Jamyard</title>
  <link rel="stylesheet" href="/shared/design.css">
  <link rel="stylesheet" href="/shared/totem.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header id="editor-header">
    <div class="header-left">
      <a href="/library" class="back-link">&larr; Back to Library</a>
      <h1 id="header-game-name">Loading...</h1>
      <div id="view-toggle" class="view-toggle">
        <button id="view-simple-btn" class="view-toggle-btn" type="button" title="Plain-English view, every step as an editable sentence">Simple</button>
        <button id="view-builder-btn" class="view-toggle-btn" type="button" title="Build with blocks, a palette of steps, suggested next steps, and settings beside the activity">Builder</button>
      </div>
    </div>
    <div class="header-right">
      <span id="save-status" class="save-status save-status-clean">Saved</span>
      <!-- Retired header actions, kept in the DOM but never shown:
           Technical view is clicked programmatically when entering the
           Builder (parks simple-view's state) and is the fallback surface
           if the Builder fails to load; Save as Recipe is parked for now
           (2026-08-15) with its wiring intact for an easy re-enable. -->
      <div hidden>
        <button id="view-advanced-btn" hidden title="The technical step map, every field, raw step ids, branch structure. For debugging and unusual activities.">Technical view</button>
        <button id="save-as-recipe-btn" hidden title="Turn this activity into a reusable template with fill-in-the-blank questions">Save as Recipe</button>
      </div>
      <button id="review-btn" class="btn btn-ghost" title="AI reviews your activity and robot players test-play it, then report anything broken or confusing">Check for Errors</button>
      <button id="test-game-btn" class="btn btn-ghost" title="Try the activity yourself with pretend players, no class needed">Preview</button>
      <button id="host-btn" class="btn btn-host" title="Save and open a live room with this activity, your class joins with the code on screen">▶ Host</button>
      <button id="save-btn" class="btn btn-ghost" title="Save your changes (the editor also auto-saves when you click away from a step)">Save</button>
    </div>
  </header>

  <div id="validation-panel" hidden>
    <button id="validation-close" class="btn-icon">&times;</button>
    <div id="validation-title"></div>
    <ul id="validation-list"></ul>
  </div>

  <div id="review-panel" class="review-panel" hidden>
    <div class="review-header">
      <h3>AI Review</h3>
      <button id="review-close" class="btn-icon">&times;</button>
    </div>
    <div id="review-content"></div>
  </div>

  <div id="editor-body">
    <!-- Left Sidebar: Activity Settings -->
    <aside id="settings-panel">
      <h2>Activity Settings</h2>
      <div class="form-group">
        <label for="game-name">Name</label>
        <input type="text" id="game-name" placeholder="Activity name">
      </div>
      <div class="form-group">
        <label for="game-description">Description</label>
        <textarea id="game-description" rows="3" placeholder="What's this activity about?"></textarea>
      </div>
      <div class="form-group">
        <label for="game-min-players">Min Players</label>
        <input type="number" id="game-min-players" min="1" placeholder="2">
      </div>
      <div class="form-group">
        <label for="game-max-players">Max Players</label>
        <input type="number" id="game-max-players" min="1" placeholder="36">
      </div>
      <div class="config-section-header">Style</div>
      <div class="form-group">
        <label for="game-theme">Theme</label>
        <select id="game-theme">
          <option value="">(Default)</option>
        </select>
      </div>
      <div id="custom-theme-section" hidden>
        <div class="form-group">
          <label for="custom-theme-desc">Describe your theme</label>
          <textarea id="custom-theme-desc" rows="3" placeholder="e.g. underwater ocean with coral accents, space theme with stars..."></textarea>
          <span class="field-help">AI will generate a color palette from your description</span>
        </div>
        <button id="generate-theme-btn" class="btn btn-secondary" style="margin-bottom:12px;" title="AI creates a custom color theme from your description">Generate Colors</button>
      </div>
      <div id="theme-preview" hidden>
        <div id="theme-preview-swatches" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;"></div>
      </div>
    </aside>

    <!-- Simple view: each step as a sentence with its editable text inline.
         The default for most teachers; the canvas below is "Advanced". -->
    <main id="simple-view" hidden>
      <!-- Inner column: capped for readable line lengths, centered so wide
           screens get balanced gutters instead of a dead right half. -->
      <div class="sv-column">
        <div id="simple-list"></div>
        <button id="simple-add-step" class="btn btn-add" type="button">+ Add a step</button>
        <span class="sv-add-hint">a new block joins the stack</span>
      </div>
    </main>

    <!-- Design chat: right column, Simple view only (chat-panel.js syncs
         visibility). The bot proposes changes as cards; nothing touches
         the config until the teacher clicks Apply. -->
    <aside id="chat-panel" hidden>
      <div class="chat-header">
        <h2>Design with AI</h2>
        <button id="chat-clear" class="btn-icon" type="button" title="Clear this conversation">Start over</button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-context-chip" hidden>
        <span id="chat-context-label"></span>
        <button id="chat-context-clear" class="btn-icon" type="button" title="Stop talking about this step">&times;</button>
      </div>
      <div class="chat-input-row">
        <textarea id="chat-input" rows="2" placeholder="Ask anything, or describe a change..."></textarea>
        <button id="chat-send" class="btn btn-primary" type="button">Send</button>
      </div>
    </aside>

    <!-- Builder view: palette / canvas / rail. The rail hosts the REAL
         settings panels (relocated by builder-view.js), no duplicate
         forms. See docs/SURFACES-PLAN.md Phase 3. -->
    <main id="builder-view" hidden>
      <aside id="builder-palette"></aside>
      <div id="builder-canvas"></div>
      <aside id="builder-rail">
        <div id="builder-rail-tabs"></div>
        <div id="builder-rail-body"></div>
      </aside>
    </main>

    <!-- Main Canvas: Phase Flow -->
    <main id="canvas-area">
      <div id="canvas-toolbar">
        <button id="add-phase-btn" class="btn btn-add">+ Add Step</button>
      </div>
      <div id="phase-canvas">
        <div id="phase-list"></div>
      </div>
      <p id="canvas-loading">Loading...</p>
      <p id="canvas-error" hidden></p>
    </main>

    <!-- Right Sidebar: Phase Config -->
    <aside id="phase-panel" class="hidden">
      <div class="panel-header">
        <h2>Step Settings</h2>
        <button id="close-phase-panel" class="btn-icon">&times;</button>
      </div>
      <div id="phase-config-form"></div>
      <div id="live-preview-section" class="hidden">
        <button id="toggle-preview-btn" title="Show a live mockup of the teacher and student screens for the selected step">Show Preview</button>
        <div id="live-preview-container" class="hidden">
          <div class="preview-screens">
            <div class="preview-screen preview-host">
              <label>HOST SCREEN</label>
              <div class="preview-screen-frame">
                <div id="preview-host-content"></div>
              </div>
            </div>
            <div class="preview-screen preview-player">
              <label>PLAYER SCREEN</label>
              <div class="preview-screen-frame">
                <div id="preview-player-content"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script src="/shared/phase-names.js"></script>
  <script src="/shared/themes.js"></script>
  <script src="/shared/my-games.js"></script>
  <script src="/shared/feedback-widget.js"></script>
  <script src="/shared/speech-input.js"></script>
  <script src="/shared/teacher-profile.js"></script>
  <script src="/shared/dialog.js"></script>
  <script src="templates.js"></script>
  <script src="editor.js"></script>
  <script src="simple-view.js"></script>
  <script src="/shared/step-suggestions.js"></script>
  <script src="builder-view.js"></script>
  <!-- Loads last: wraps renderCanvas (visibility sync must be outermost). -->
  <script src="chat-panel.js"></script>
</body>
</html>
