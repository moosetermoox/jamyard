<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Game - Classroom Games</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header id="editor-header">
    <div class="header-left">
      <a href="/designer" class="back-link">&larr; Back to List</a>
      <h1 id="header-game-name">Loading...</h1>
    </div>
    <div class="header-right">
      <span id="save-status" class="save-status save-status-clean">Saved</span>
      <button id="ask-ai-btn" class="btn btn-ask-ai">Ask AI</button>
      <button id="review-btn" class="btn btn-review">Check My Game</button>
      <button id="test-game-btn" class="btn btn-secondary">Test Game</button>
      <button id="save-btn" class="btn btn-primary">Save</button>
    </div>
  </header>

  <div id="validation-panel" hidden>
    <button id="validation-close" class="btn-icon">&times;</button>
    <div id="validation-title"></div>
    <ul id="validation-list"></ul>
  </div>

  <div id="review-panel" class="review-panel" hidden>
    <div class="review-header">
      <h3>AI Game Review</h3>
      <button id="review-close" class="btn-icon">&times;</button>
    </div>
    <div id="review-content"></div>
  </div>

  <div id="editor-body">
    <!-- Left Sidebar: Game Settings -->
    <aside id="settings-panel">
      <h2>Game Settings</h2>
      <div class="form-group">
        <label for="game-name">Name</label>
        <input type="text" id="game-name" placeholder="Game name">
      </div>
      <div class="form-group">
        <label for="game-description">Description</label>
        <textarea id="game-description" rows="3" placeholder="What's this game about?"></textarea>
      </div>
      <div class="form-group">
        <label for="game-min-players">Min Players</label>
        <input type="number" id="game-min-players" min="1" placeholder="2">
      </div>
      <div class="form-group">
        <label for="game-max-players">Max Players</label>
        <input type="number" id="game-max-players" min="1" placeholder="36">
      </div>
      <div class="config-section-header">Style</div>
      <div class="form-group">
        <label for="game-theme">Game Theme</label>
        <select id="game-theme">
          <option value="">(Default)</option>
        </select>
      </div>
      <div id="custom-theme-section" hidden>
        <div class="form-group">
          <label for="custom-theme-desc">Describe your theme</label>
          <textarea id="custom-theme-desc" rows="3" placeholder="e.g. underwater ocean with coral accents, space theme with stars..."></textarea>
          <span class="field-help">AI will generate a color palette from your description</span>
        </div>
        <button id="generate-theme-btn" class="btn btn-secondary" style="margin-bottom:12px;">Generate Colors</button>
      </div>
      <div id="theme-preview" hidden>
        <div id="theme-preview-swatches" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;"></div>
      </div>
    </aside>

    <!-- Main Canvas: Phase Flow -->
    <main id="canvas-area">
      <div id="canvas-toolbar">
        <button id="add-phase-btn" class="btn btn-add">+ Add Step</button>
      </div>
      <div id="phase-canvas">
        <div id="phase-list"></div>
      </div>
      <p id="canvas-loading">Loading game...</p>
      <p id="canvas-error" hidden></p>
    </main>

    <!-- Right Sidebar: Phase Config -->
    <aside id="phase-panel" class="hidden">
      <div class="panel-header">
        <h2>Step Settings</h2>
        <button id="close-phase-panel" class="btn-icon">&times;</button>
      </div>
      <div id="phase-config-form"></div>
      <div id="live-preview-section" class="hidden">
        <button id="toggle-preview-btn">Show Preview</button>
        <div id="live-preview-container" class="hidden">
          <div class="preview-screens">
            <div class="preview-screen preview-host">
              <label>HOST SCREEN</label>
              <div class="preview-screen-frame">
                <div id="preview-host-content"></div>
              </div>
            </div>
            <div class="preview-screen preview-player">
              <label>PLAYER SCREEN</label>
              <div class="preview-screen-frame">
                <div id="preview-player-content"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <div id="ask-ai-modal" class="ask-ai-modal" hidden>
    <div class="ask-ai-modal-inner">
      <div class="ask-ai-header">
        <h3 id="ask-ai-title">Ask AI to revise this game</h3>
        <button id="ask-ai-close" class="btn-icon">&times;</button>
      </div>
      <p id="ask-ai-subtitle" class="ask-ai-subtitle">Describe what you'd like to change in plain English.</p>
      <textarea id="ask-ai-input" rows="3" placeholder="e.g. Make round 1 longer, add a leaderboard at the end, change the AI roast to be more sarcastic"></textarea>
      <div class="ask-ai-actions">
        <button id="ask-ai-submit" class="btn btn-primary">Ask AI</button>
      </div>
      <div id="ask-ai-status" class="ask-ai-status" hidden></div>
      <div id="ask-ai-result" hidden>
        <div class="ask-ai-summary" id="ask-ai-summary"></div>
        <div id="ask-ai-errors" class="ask-ai-errors" hidden></div>
        <div class="ask-ai-result-actions">
          <button id="ask-ai-apply" class="btn btn-primary">Apply</button>
          <button id="ask-ai-discard" class="btn btn-secondary">Discard</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/shared/themes.js"></script>
  <script src="templates.js"></script>
  <script src="editor.js"></script>
</body>
</html>
