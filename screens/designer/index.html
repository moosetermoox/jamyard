<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Activity - Jamyard</title>
  <link rel="stylesheet" href="/shared/design.css">
  <link rel="stylesheet" href="/shared/totem.css">
  <link rel="stylesheet" href="/shared/activity-map.css">
  <link rel="stylesheet" href="/shared/make-it-yours-doors.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Create an Activity</h1>
    <a href="/#yard" class="back-link">&larr; The yard</a>
  </header>

  <main>
    <!-- Idea-first front door: the teacher's idea is the entry point.
         Routes through /api/games/from-description (recipe match) with
         the no-match view offering the picker + legacy generator. -->
    <section id="idea-hero">
      <h2 class="idea-hero-title">What do you want to do with your <span class="t-painted-word">class?</span></h2>
      <div class="idea-input-row">
        <textarea id="idea-input" rows="2"
          placeholder="Describe it in plain words. 'a quick poll about our field trip', 'something to help my class feel more connected', 'students write funny excuses and vote on the best'..."></textarea>
        <button id="idea-go-btn" title="AI builds a first draft of your activity, you can edit everything after">Make it</button>
      </div>
      <div class="idea-examples">
        <span class="idea-examples-label">Try one of these</span>
        <button class="idea-example-chip" type="button">I want my class to laugh together</button>
        <button class="idea-example-chip" type="button">A quick poll before lunch</button>
        <button class="idea-example-chip" type="button">Turn everyone's ideas into one class answer</button>
        <button class="idea-example-chip" type="button">Honest anonymous feedback about how class is going</button>
        <button class="idea-example-chip" type="button">Students write encouragement for a classmate</button>
        <button class="idea-example-chip" type="button">A bluffing game where students invent fake answers</button>
        <button class="idea-example-chip" type="button">Help my students get to know each other</button>
      </div>
      <p class="idea-advanced-links">
        <a href="#" id="not-sure-link" title="Three quick questions, then suggestions that fit your class">Not sure what to make? Let's figure it out</a>
      </p>
      <p class="idea-advanced-links">
        Prefer to build it yourself?
        <a href="#" id="use-recipe-link">Browse recipes</a>
      </p>
    </section>

    <!-- The activity grid that used to live here moved to /library (the
         one shelf, see docs/SURFACES-PLAN.md). This page is now only the
         starting point for something new. -->
    <p class="idea-library-link">
      Looking for an existing activity? <a href="/#yard">Open the yard</a>
    </p>
  </main>

  <script src="/shared/phase-names.js"></script>
  <script src="/shared/activity-map.js"></script>
  <script src="/shared/dialog.js"></script>
  <script src="/shared/game-visibility.js"></script>
  <script src="/shared/activity-prefs.js"></script>
  <script src="/shared/my-games.js"></script>
  <script src="/shared/owner-mode.js"></script>
  <script src="/shared/teacher-profile.js"></script>
  <script src="/shared/feedback-widget.js"></script>
  <script src="/shared/analytics.js"></script>
  <script src="/shared/replay.js"></script>
  <script src="/shared/step-suggestions.js"></script>
  <script src="/shared/sse-reader.js"></script>
  <script src="/shared/make-it-yours-doors.js"></script>
  <script src="/shared/speech-input.js"></script>
  <script src="/shared/host-launch.js"></script>
  <script src="designer.js"></script>
</body>
</html>
