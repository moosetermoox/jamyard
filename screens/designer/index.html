<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Designer - Lanyard</title>
  <link rel="stylesheet" href="/shared/design.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Activity Designer</h1>
    <a href="/" class="back-link">Back to Home</a>
  </header>

  <main>
    <!-- Idea-first front door: the teacher's idea is the entry point.
         Routes through /api/games/from-description (recipe match) with
         the no-match view offering the picker + legacy generator. -->
    <section id="idea-hero">
      <h2 class="idea-hero-title">What do you want to do with your class?</h2>
      <div class="idea-input-row">
        <textarea id="idea-input" rows="2"
          placeholder="Describe it in plain words — 'a quick poll about our field trip', 'something to help my class feel more connected', 'students write funny excuses and vote on the best'..."></textarea>
        <button id="idea-go-btn">Make it</button>
      </div>
      <div class="idea-examples">
        <span class="idea-examples-label">Try:</span>
        <button class="idea-example-chip" type="button">I want my class to laugh together</button>
        <button class="idea-example-chip" type="button">A quick poll before lunch</button>
        <button class="idea-example-chip" type="button">Turn everyone's ideas into one class answer</button>
        <button class="idea-example-chip" type="button">A three-round elimination game with funny answers</button>
      </div>
      <p class="idea-advanced-links">
        Prefer to build it yourself?
        <a href="#" id="use-recipe-link">Browse recipes</a>
        <span class="idea-link-sep">·</span>
        <a href="#" id="create-new-link">Start from scratch</a>
      </p>
    </section>

    <section id="games-section">
      <div id="library-controls" hidden>
        <input type="search" id="library-search" placeholder="Search activities…"
               aria-label="Search activities">
        <div id="goal-chips" role="group" aria-label="Filter by goal"></div>
      </div>
      <p id="loading-message">Loading games...</p>
      <p id="error-message" hidden></p>
      <div id="games-grid"></div>
    </section>
  </main>

  <script src="/shared/dialog.js"></script>
  <script src="/shared/game-visibility.js"></script>
  <script src="/shared/activity-prefs.js"></script>
  <script src="/shared/my-games.js"></script>
  <script src="/shared/owner-mode.js"></script>
  <script src="/shared/feedback-widget.js"></script>
  <script src="templates.js"></script>
  <script src="designer.js"></script>
</body>
</html>
