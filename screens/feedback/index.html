<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Inbox. Lanyard</title>
  <link rel="stylesheet" href="/shared/design.css">
  <style>
    /* Paste-up system (docs/paper-layout-test/): paper entries on a
       grained gesso ground, ink band header, category chips flip ink. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --focus-ring: 3px solid #221E1C; }

    body {
      font-family: 'Nunito', Arial, sans-serif;
      font-weight: 600;
      background: #EFE9DC;
      color: #221E1C;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.5;
      background-image:
        radial-gradient(rgba(120,105,80,0.35) 0.5px, transparent 0.6px),
        radial-gradient(rgba(80,70,55,0.22) 0.5px, transparent 0.6px);
      background-size: 4px 4px, 7px 7px;
      background-position: 0 0, 2px 3px;
    }

    header {
      background: #221E1C;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: 0 3px 0 rgba(34,30,28,0.10);
    }

    header a.logo {
      font-family: 'Archivo Black', 'Arial Black', Arial, sans-serif;
      font-size: 1.2rem;
      color: #FBF7EC;
      text-decoration: none;
    }

    header .title {
      font-family: 'Nunito', Arial, sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #CFC5B4;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tabs button {
      padding: 8px 18px;
      border: none;
      border-radius: 2px;
      background: #FFFDF6;
      box-shadow: 2px 2px 0 rgba(34,30,28,0.14);
      font-family: 'Nunito', Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #221E1C;
      cursor: pointer;
      transition: transform 90ms steps(2, end), box-shadow 90ms steps(2, end);
    }

    .tabs button:nth-child(odd) { transform: rotate(-0.7deg); }
    .tabs button:nth-child(even) { transform: rotate(0.6deg); }

    .tabs button:hover {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 rgba(34,30,28,0.14);
    }

    /* Selected tab flips to ink */
    .tabs button.active {
      background: #221E1C;
      color: #FBF7EC;
    }

    .empty, .loading, .error {
      color: #6E6353;
      font-weight: 700;
      padding: 30px 0;
      text-align: center;
    }

    .error { color: #AE3A16; }

    .entry {
      background: #FFFDF6;
      border: none;
      border-radius: 2px;
      box-shadow: 2px 2px 0 rgba(34,30,28,0.12), 0 0 0 1px rgba(34,30,28,0.08);
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .entry.is-done {
      opacity: 0.55;
      box-shadow: 0 0 0 1px rgba(34,30,28,0.10);
    }

    .entry-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      font-size: 0.78rem;
      color: #6E6353;
    }

    .entry-category {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 10px;
      border: none;
      border-radius: 2px;
      background: #EFE9DC;
      box-shadow: 0 0 0 1px rgba(34,30,28,0.18);
      color: #221E1C;
    }

    /* Problems get the loud mark; other categories stay quiet paper */
    .entry-category.cat-problem { box-shadow: 0 0 0 2px #AE3A16; color: #AE3A16; }
    .entry-category.cat-praise  { background: #FFD3E6; }

    .entry-message {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.95rem;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .entry-actions button {
      padding: 6px 14px;
      border: none;
      border-radius: 2px;
      background: #FFFDF6;
      box-shadow: 2px 2px 0 rgba(34,30,28,0.14);
      font-family: 'Nunito', Arial, sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 90ms steps(2, end), box-shadow 90ms steps(2, end);
    }

    .entry-actions button:hover {
      background: #221E1C;
      color: #FBF7EC;
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 rgba(34,30,28,0.14);
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="/">Lanyard</a>
    <span class="title">📬 Feedback Inbox</span>
  </header>

  <main>
    <div class="tabs" id="tabs">
      <button data-tab="new" class="active">New</button>
      <button data-tab="done">Done</button>
      <button data-tab="all">All</button>
    </div>
    <div id="list"><p class="loading">Loading…</p></div>
  </main>

  <script src="feedback.js"></script>
</body>
</html>
