<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Inbox. Jamyard</title>
  <link rel="stylesheet" href="/shared/design.css">
  <link rel="stylesheet" href="/shared/totem.css">
  <style>
    /* Totem system (docs/design/totem/): paper entries on a flat gesso
       ground, ink band header, yellow = the tab you're on. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --focus-ring: 3px solid #2A2620; }

    body {
      font-family: var(--t-body);
      font-weight: 500;
      background: var(--t-gesso);
      color: var(--t-ink);
      min-height: 100vh;
    }

    header {
      background: var(--t-ink);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    header a.logo {
      font-family: var(--t-display);
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--t-paper);
      text-decoration: none;
    }

    header .title {
      font-family: var(--t-body);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #CFC5B4;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tabs button {
      padding: 8px 18px;
      border: none;
      background: var(--t-paper);
      box-shadow: 0 2px 3px rgba(50,35,15,0.25);
      font-family: var(--t-body);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--t-ink);
      cursor: pointer;
      transition: transform var(--t-quick) var(--t-ease);
    }

    .tabs button:nth-child(odd) { transform: rotate(-0.7deg); }
    .tabs button:nth-child(even) { transform: rotate(0.6deg); }

    .tabs button:nth-child(odd):hover { transform: rotate(-0.7deg) translateY(-3px); }
    .tabs button:nth-child(even):hover { transform: rotate(0.6deg) translateY(-3px); }

    /* Yellow = the tab you're on */
    .tabs button.active {
      background: var(--t-yellow);
      background-image: var(--t-grain);
      color: var(--t-ink);
    }

    .empty, .loading, .error {
      color: var(--t-muted);
      font-weight: 700;
      padding: 30px 0;
      text-align: center;
    }

    .error { color: #AE3A16; }

    .entry {
      background: var(--t-paper);
      box-shadow: 0 2px 4px rgba(50,35,15,0.22);
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .entry.is-done {
      opacity: 0.55;
      box-shadow: 0 0 0 1px rgba(50,35,15,0.10);
    }

    .entry-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      font-size: 0.78rem;
      color: var(--t-muted);
    }

    .entry-category {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 10px;
      border: none;
      background: var(--t-gesso);
      box-shadow: 0 0 0 1px rgba(50,35,15,0.18);
      color: var(--t-ink);
    }

    /* Problems get the loud mark; praise leans magenta (play/social) */
    .entry-category.cat-problem { box-shadow: 0 0 0 2px #AE3A16; color: #AE3A16; }
    .entry-category.cat-praise  { background: #F3D9EA; }

    .entry-message {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.95rem;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .entry-actions button {
      padding: 6px 14px;
      border: none;
      background: var(--t-paper);
      box-shadow: 0 2px 3px rgba(50,35,15,0.25);
      font-family: var(--t-body);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform var(--t-quick) var(--t-ease);
    }

    .entry-actions button:hover {
      background: var(--t-ink);
      color: var(--t-paper);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="/">Jamyard</a>
    <span class="title">Feedback inbox</span>
  </header>

  <main>
    <div class="tabs" id="tabs">
      <button data-tab="new" class="active">New</button>
      <button data-tab="done">Done</button>
      <button data-tab="all">All</button>
    </div>
    <div id="list"><p class="loading">Loading…</p></div>
  </main>

  <script src="feedback.js"></script>
</body>
</html>
