<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Library - Jamyard</title>
  <link rel="stylesheet" href="/shared/design.css">
  <!-- Paste-up system (docs/paper-layout-test/): this stylesheet is
       standalone, the library no longer borrows the designer's look. -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="halftone-corner" aria-hidden="true"></div>

  <div class="page">
    <header>
      <a class="wordmark" href="/" aria-label="Jamyard, back to home">
        <span class="lm-archivo lm-scrap" style="transform: rotate(-2deg)">J</span>
        <span class="lm-garamond lm-vermillion" style="transform: rotate(1.5deg)">A</span>
        <span class="lm-nunito lm-ink" style="transform: rotate(-1deg)">M</span>
        <span class="lm-archivo lm-scrap" style="transform: rotate(2deg)">Y</span>
        <span class="lm-garamond lm-scrap" style="transform: rotate(-1.5deg)">A</span>
        <span class="lm-archivo lm-ink" style="transform: rotate(1deg)">R</span>
        <span class="lm-nunito lm-scrap" style="transform: rotate(-2deg)">D</span>
      </a>
      <a href="/" class="back-link">back to home</a>
    </header>

    <main>
      <section id="library-section">
        <h1 class="spoken">What do you want to do together?</h1>
        <div id="teacher-setup"></div>
        <div id="library-controls" hidden>
          <input type="search" id="library-search" placeholder="Search activities…"
                 aria-label="Search activities">
          <div id="goal-chips" role="group" aria-label="Filter by goal"></div>
        </div>
        <p id="loading-message">Loading the library…</p>
        <p id="error-message" hidden></p>
        <div id="library-grid"></div>

        <div class="builder-doorway">
          <p>Want something that isn't here?</p>
          <button id="build-your-own-btn" type="button"><span class="misprint">🛠 BUILD YOUR OWN ACTIVITY</span></button>
        </div>

        <p class="privacy-footnote"><a href="/guide">Teacher guide: setup, live controls, quick fixes</a> · <a href="/privacy">Privacy: what we keep, why, and when it is deleted</a></p>
      </section>
    </main>
  </div>

  <script src="/shared/dialog.js"></script>
  <script src="/shared/game-visibility.js"></script>
  <script src="/shared/activity-prefs.js"></script>
  <script src="/shared/my-games.js"></script>
  <script src="/shared/owner-mode.js"></script>
  <script src="/shared/teacher-profile.js"></script>
  <script src="/shared/feedback-widget.js"></script>
  <script src="/shared/speech-input.js"></script>
  <script src="library.js"></script>
</body>
</html>
