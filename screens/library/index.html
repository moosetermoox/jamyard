<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Yard - Jamyard</title>
  <link rel="stylesheet" href="/shared/design.css">
  <!-- Totem system (docs/design/totem/): this stylesheet is
       standalone, the library no longer borrows the designer's look. -->
  <link rel="stylesheet" href="/shared/totem.css">
  <link rel="stylesheet" href="/shared/activity-map.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header>
      <a class="wordmark" href="/" aria-label="Jamyard, back to home">
        <span class="wm-jam">JAM</span>
        <span class="wm-yard">YARD</span>
      </a>
      <a href="/" class="back-link">back to home</a>
    </header>

    <main>
      <section id="library-section">
        <h1 class="spoken">What do you want to do <span class="t-painted-word">together</span>?</h1>
        <div id="teacher-setup"></div>
        <div id="library-controls" hidden>
          <input type="search" id="library-search" placeholder="Search the yard…"
                 aria-label="Search the yard">
          <div id="goal-chips" role="group" aria-label="Filter by goal"></div>
        </div>
        <p id="loading-message">Loading the yard…</p>
        <p id="error-message" hidden></p>
        <div id="library-grid"></div>

        <div class="builder-doorway">
          <p>Want something that isn't here?</p>
          <button id="build-your-own-btn" type="button">+ BUILD YOUR OWN ACTIVITY</button>
        </div>

        <p class="privacy-footnote"><a href="/guide">Teacher guide: setup, live controls, quick fixes</a> · <a href="/privacy">Privacy: what we keep, why, and when it is deleted</a></p>
      </section>
    </main>
  </div>

  <script src="/shared/dialog.js"></script>
  <script src="/shared/phase-names.js"></script>
  <script src="/shared/activity-map.js"></script>
  <script src="/shared/game-visibility.js"></script>
  <script src="/shared/goal-groups.js"></script>
  <script src="/shared/activity-prefs.js"></script>
  <script src="/shared/my-games.js"></script>
  <script src="/shared/owner-mode.js"></script>
  <script src="/shared/teacher-profile.js"></script>
  <script src="/shared/feedback-widget.js"></script>
  <script src="/shared/speech-input.js"></script>
  <script src="/shared/setup-knobs.js"></script>
  <script src="/shared/growing-text.js"></script>
  <script src="library.js"></script>
</body>
</html>
