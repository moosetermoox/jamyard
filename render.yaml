# Render Blueprint for the Lanyard server.
# https://render.com/docs/blueprint-spec
#
# This captures the deploy config in the repo. The existing dashboard-created
# service keeps working as-is; this file documents how it's wired and lets the
# service be recreated from scratch ("New > Blueprint") if ever needed.
#
# IMPORTANT: ANTHROPIC_API_KEY is intentionally NOT stored here (sync: false).
# Without it the server boots in mock mode and the AI Generate / Ask AI features
# are disabled. Set the value in the Render dashboard:
#   Dashboard > lanyard > Environment > Add Environment Variable
# then redeploy. Startup log should then read "[init] AI Service mode: real".
services:
  - type: web
    name: lanyard
    runtime: node
    plan: free
    branch: master
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Required for AI features. Enter the value in the dashboard — never commit it.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The site OWNER's password (any username). The site itself is public —
      # visitors can host featured activities and build their own. This
      # password unlocks: the full activity list (owner mode), the feedback
      # inbox at /feedback, edits/deletes of built-in activities, and the
      # teacher console via Basic Auth. Leave unset only for local dev.
      - key: SITE_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: "22"
